name: Final icon row fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-icon-row.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final icon row fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('style.css?v=20260823-1320', 'style.css?v=20260823-1330')
          s = s.replace('assets/Icons%20Ayo/v2/', 'assets/Icons%20Ayo/v3/')
          s = s.replace('?v=20260823-1320', '?v=20260823-1330')
          p.write_text(s, encoding='utf-8')

          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* FINAL ICON ROW ALIGNMENT 20260823-1330 */'
          if marker not in s:
              s += '''\n\n/* FINAL ICON ROW ALIGNMENT 20260823-1330 */\n.icon-card > a {\n    height: 108px;\n    align-items: flex-start;\n}\n\n.icon-card img {\n    width: auto;\n    max-width: none;\n    object-fit: contain;\n    display: block;\n}\n\n/* Measured from the actual rendered original artwork.\n   Each visible icon is normalized to the same 99 px visual height. */\n.icon-card:nth-child(1) img { height: 102.062px; }\n.icon-card:nth-child(2) img { height: 103.125px; }\n.icon-card:nth-child(3) img { height: 100px; }\n.icon-card:nth-child(4) img { height: 105.319px; }\n.icon-card:nth-child(5) img { height: 107.609px; }\n'''
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix: use original icons and pixel-align visible heights'
          git push
