name: Normalize downloadable icons

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize_download_icons.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Normalize icons
        run: |
          if [ -f tools/normalize_download_icons.py ]; then
            python tools/normalize_download_icons.py
          fi

      - name: Commit normalized icons
        run: |
          if git diff --quiet -- 'assets/Icons Ayo'; then
            echo 'No icon changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'assets/Icons Ayo'
          git commit -m 'fix: normalize downloadable icon artwork heights'
          git push
