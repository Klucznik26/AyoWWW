name: Rebuild icon row

on:
  push:
    branches: [main]
    paths:
      - 'tools/rebuild_icon_row.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Rebuild normalized icons and update page references
        run: python tools/rebuild_icon_row.py

      - name: Simplify icon CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          start = s.index('.icon-card > a {')
          end = s.index('.icon-card p {', start)
          replacement = '''.icon-card > a {\n    width: 140px;\n    height: 100px;\n    display: flex;\n    align-items: flex-start;\n    justify-content: center;\n}\n\n.icon-card img {\n    height: 100px;\n    width: auto;\n    max-width: none;\n    object-fit: contain;\n    display: block;\n}\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit rebuilt row
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css 'assets/Icons Ayo/v2'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: rebuild downloadable icon row cleanly'
          git push
