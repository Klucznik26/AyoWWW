<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ayo Ecosystem — lightweight Linux desktop applications for image workflows and system tools.">
    <meta name="theme-color" content="#2b231b">
    <title>Ayo Ecosystem</title>
    <link rel="icon" type="image/png" href="assets/logo/Ayo.png">
    <link rel="stylesheet" href="style.css?v=20260823-2">
</head>
<body>
<header class="site-header">
    <a class="brand" href="#" aria-label="Ayo Ecosystem">
        <img src="assets/logo/Ayo.png" alt="" aria-hidden="true">
        <span>
            <strong>Ayo Ecosystem</strong>
            <small>Linux desktop tools</small>
        </span>
    </a>

    <div class="language-picker">
        <button id="language-toggle" class="language-toggle" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="current-flag" aria-hidden="true">🇵🇱</span>
            <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div id="language-panel" class="language-panel" role="menu" hidden></div>
    </div>
</header>

<main>
    <section class="hero">
        <span class="eyebrow">Ayo</span>
        <h1>Ayo Ecosystem</h1>
        <p id="intro-text"></p>
        <div class="hero-meta">
            <span>Linux-first</span>
            <span>Local-first</span>
            <span>Python + Qt</span>
            <span>49 languages on AyoWWW</span>
        </div>
    </section>

    <section class="projects-section" aria-labelledby="projects-title">
        <div class="section-heading">
            <h2 id="projects-title"></h2>
            <span class="section-count">6</span>
        </div>
        <div id="project-grid" class="project-grid"></div>
    </section>

    <section class="icon-downloads" aria-labelledby="icons-title">
        <div class="section-heading">
            <h2 id="icons-title"></h2>
            <span class="section-count">5</span>
        </div>

        <div class="icon-download-list">
            <div class="icon-card">
                <a href="assets/Icons%20Ayo/v3/ayoup.png" download="ayoup.png" title="AyoUP">
                    <img src="assets/Icons%20Ayo/v3/ayoup.png?v=20260823-1330" alt="AyoUP icon">
                </a>
                <p>AYO UP</p>
            </div>
            <div class="icon-card">
                <a href="assets/Icons%20Ayo/v3/ayoconvert.png" download="ayoconvert.png" title="AyoCONVERT">
                    <img src="assets/Icons%20Ayo/v3/ayoconvert.png?v=20260823-1330" alt="AyoCONVERT icon">
                </a>
                <p>AYO CONVERT</p>
            </div>
            <div class="icon-card">
                <a href="assets/Icons%20Ayo/v3/ayoarch.png" download="ayoarch.png" title="AyoARCHI">
                    <img src="assets/Icons%20Ayo/v3/ayoarch.png?v=20260823-1330" alt="AyoARCHI icon">
                </a>
                <p>AYO ARCHI</p>
            </div>
            <div class="icon-card">
                <a href="assets/Icons%20Ayo/v3/ayosort.png" download="ayosort.png" title="AyoSORT">
                    <img src="assets/Icons%20Ayo/v3/ayosort.png?v=20260823-1330" alt="AyoSORT icon">
                </a>
                <p>AYO SORT</p>
            </div>
            <div class="icon-card">
                <a href="assets/Icons%20Ayo/v3/ayofolder.png" download="ayofolder.png" title="Ayo Folder">
                    <img src="assets/Icons%20Ayo/v3/ayofolder.png?v=20260823-1330" alt="Ayo Folder icon">
                </a>
                <p>AYO FOLDER</p>
            </div>
        </div>
    </section>
</main>

<footer>
    <span>© Ayo Ecosystem</span>
    <span id="updated-text"></span>
</footer>

<script src="i18n-1.js?v=20260823-2"></script>
<script src="i18n-2.js?v=20260823-2"></script>
<script src="i18n-3.js?v=20260823-2"></script>
<script src="i18n-4.js?v=20260823-2"></script>
<script src="i18n-5.js?v=20260823-2"></script>
<script src="site-core.js?v=20260823-2"></script>
</body>
</html>
